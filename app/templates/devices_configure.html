{% extends 'base.html' %}
{% block title %}My devices{% endblock %}

{% block page_content %}
<div class="container mt-5">
    <h1>La ip del dispositivo que deseas configurar es: {{ip}}</h1>
</div>
<div class="container mt-5">

    {% if output %}
    <h2>{{ output }}</h2>
    {% endif %}

    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
</div>

{% endblock %}
